{% extends 'base.html' %}
{% block title %}{{ page_title }} · Green Hospital{% endblock %}

{% block content %}
<div class="room-form-page" style="max-width: 500px; margin: 0 auto;">
  <div class="page-heading">
    <div>
      <a class="back-link" href="{% url 'chamber_list' %}">‹ Back to Consultation Room</a>
      <p class="eyebrow">FACILITY MANAGEMENT</p>
      <h1>{{ page_title }}</h1>
    </div>
  </div>

  <div class="panel padded-panel">
    <form method="post" class="smart-form">
      {% csrf_token %}

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="field-label" style="font-weight: 600; margin-bottom: 6px; display: block;">Room Number <span style="color: #e11d48;">*</span></label>
        <input type="text" name="room_number" value="{{ chamber.room_number|default:'' }}" class="field-control" placeholder="e.g. Room 302" required style="width: 100%; height: 40px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="field-label" style="font-weight: 600; margin-bottom: 6px; display: block;">Description / Note</label>
        <textarea name="description" class="field-control" rows="3" placeholder="Brief note or description..." style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; resize: vertical;">{{ chamber.description|default:'' }}</textarea>
      </div>

      <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 12px;">
        <a href="{% url 'chamber_list' %}" class="button button-outline">Cancel</a>
        <button type="submit" class="button button-primary">Save Room</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
