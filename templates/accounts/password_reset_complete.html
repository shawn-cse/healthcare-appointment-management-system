{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete - Green Hospital{% endblock %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card p-4 text-center mt-5">
                    <div class="mb-3">
                        <i class="far fa-check-circle fa-4x text-success"></i>
                    </div>
                    <h3>Password Reset Complete</h3>
                    <p class="text-muted mt-2">
                        Your password has been changed successfully. You may now log in with your new credentials.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log In Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
