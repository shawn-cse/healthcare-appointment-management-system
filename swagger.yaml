openapi: 3.0.3
info:
  title: Green Hospital — Internal Services
  version: 1.0.0
  description: >-
    The application uses Django server-rendered HTML forms for core operations.
    This specification documents the JSON endpoints and hosted payment callbacks.
servers:
  - url: http://localhost:8000
paths:
  /health/:
    get:
      summary: Web/database health
      responses:
        '200':
          description: Database connection is healthy
        '503':
          description: Database is unavailable
  /api/slots/:
    get:
      summary: Open capacity for a staff-authorized doctor and date
      description: Requires an authenticated doctor, assigned receptionist or administrator.
      parameters:
        - name: doctor
          in: query
          required: true
          schema: {type: integer}
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Available appointment times
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        label: {type: string}
                        remaining: {type: integer}
                        capacity: {type: integer}
        '302': {description: Sign-in required}
        '404': {description: Doctor not assigned to this user}
  /payments/callback/{result}/:
    post:
      summary: Hosted SSLCOMMERZ return / IPN
      description: Payment is not marked verified until validated server-to-server with SSLCOMMERZ.
      parameters:
        - name: result
          in: path
          required: true
          schema:
            type: string
            enum: [success, fail, cancel, ipn]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                val_id: {type: string}
                tran_id: {type: string}
      responses:
        '200': {description: Acknowledgement or HTML redirect}
        '302': {description: Patient redirected to the application}
        '503': {description: Gateway validation unavailable; IPN should retry}
